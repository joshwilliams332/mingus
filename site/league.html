<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My League · Mingus Sports</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232fbf8a%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22Arial%22 font-weight=%22900%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22%2306150f%22%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main><p class="loading">Loading…</p></main>
  <script src="assets/common.js"></script>
  <script>
    Mingus.start(async (main, meta) => {
      // League setup talks to scripts/serve.py; on any other server these calls fail and the page explains how to start it.
      const api = {
        async status() {
          try {
            const r = await fetch("api/status", { headers: { "X-Mingus": "1" }, cache: "no-store" });
            return r.ok ? await r.json() : null;
          } catch (e) { return null; }
        },
        async post(path, body) {
          const r = await fetch(path, { method: "POST", headers: { "X-Mingus": "1", "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
          return r.json();
        },
      };
      const status = await api.status();

      // Accepts a full ESPN link (pulls out leagueId and teamId) or just the league number.
      function parseLeagueInput(text) {
        const m = text.match(/leagueId=(\d+)/i), t = text.match(/teamId=(\d+)/i);
        return { league_id: m ? m[1] : text.trim(), team_id: t ? t[1] : "" };
      }

      function leagueForm() {
        return `<form class="card league-form">
          <h3>Add an ESPN league</h3>
          <label class="field">ESPN team page link or League ID
            <input name="link" required placeholder="https://fantasy.espn.com/football/team?leagueId=...&teamId=...">
          </label>
          <div class="field-row">
            <label class="field">Your team ID <span class="muted">(filled in from the link)</span><input name="team_id" inputmode="numeric" placeholder="e.g. 7"></label>
            <label class="field">Name in the switcher <span class="muted">(optional)</span><input name="label" maxlength="40" placeholder="e.g. Work league"></label>
          </div>
          <details class="cookie-help" ${status?.has_cookies ? "" : "open"}>
            <summary>Private league? ${status?.has_cookies ? `<span class="pill ok">ESPN cookies saved</span>` : "Add your ESPN login cookies (only needed once)"}</summary>
            <ol class="muted small">
              <li>On fantasy.espn.com (logged in), click the lock icon left of the address bar → <strong>Cookies</strong>.</li>
              <li>Open <strong>espn.com → Cookies</strong>, click <strong>espn_s2</strong> and copy its Content, then do the same for <strong>SWID</strong> (keep the curly braces).</li>
              <li>They're saved only on this computer (in <code>scripts/espn_config.json</code>) and work for all your leagues. Treat them like a password.</li>
            </ol>
            <div class="field-row">
              <label class="field">espn_s2<input name="espn_s2" type="password" autocomplete="off" placeholder="${status?.has_cookies ? "saved (leave blank to keep)" : "long value"}"></label>
              <label class="field">SWID<input name="swid" type="password" autocomplete="off" placeholder="${status?.has_cookies ? "saved (leave blank to keep)" : "{XXXXXXXX-XXXX-...}"}"></label>
            </div>
          </details>
          <button class="btn" type="submit">Add league and sync</button>
          <div class="sync-log" role="status"></div>
        </form>`;
      }

      function showLog(el, res) {
        el.innerHTML = (res.error ? `<p class="neg-num">${esc(res.error)}</p>` : "") +
          (res.log || []).map(l => `<p class="${/WARNING|failed|private/i.test(l) ? "neg-num" : ""}">${esc(l)}</p>`).join("");
      }

      function wireForm(form) {
        const link = form.elements.link, team = form.elements.team_id;
        link.addEventListener("input", () => { const p = parseLeagueInput(link.value); if (p.team_id) team.value = p.team_id; });
        form.onsubmit = async e => {
          e.preventDefault();
          const out = form.querySelector(".sync-log"), btn = form.querySelector("button");
          const p = parseLeagueInput(link.value);
          btn.disabled = true;
          out.innerHTML = `<p class="muted">Syncing with ESPN…</p>`;
          try {
            const res = await api.post("api/leagues", {
              league_id: p.league_id, team_id: team.value.trim() || p.team_id, label: form.elements.label.value,
              espn_s2: form.elements.espn_s2.value, swid: form.elements.swid.value,
            });
            showLog(out, res);
            if (res.ok && !(res.log || []).some(l => l.includes(p.league_id) && /WARNING|failed/.test(l))) {
              setTimeout(() => { location.href = `league.html?league=${p.league_id}`; }, 900);
            }
          } catch (err) {
            out.innerHTML = `<p class="neg-num">Couldn't reach the local server. Is <code>python scripts/serve.py</code> running?</p>`;
          }
          btn.disabled = false;
        };
      }

      function manageView() {
        return `<section class="card manage-panel">
          <div class="card-head"><h3>Your leagues</h3>
            <div class="manage-actions"><button class="btn-plain" data-act="sync">Refresh from ESPN</button>
            ${status.has_cookies ? `<button class="btn-plain" data-act="clear">Remove saved cookies</button>` : ""}</div></div>
          <ul class="league-list">${status.leagues.map(l => `<li>
            <span><strong>${esc(l.label || `League ${l.league_id}`)}</strong> <span class="muted small">League ${esc(l.league_id)}${l.team_id ? ` · Team ${esc(l.team_id)}` : ""}</span></span>
            <button class="btn-plain small-btn" data-remove="${esc(l.league_id)}">Remove</button></li>`).join("") || `<li class="muted">No leagues yet.</li>`}</ul>
          <div class="sync-log" role="status"></div>
        </section>
        ${leagueForm()}`;
      }

      function wireManage(root) {
        const out = root.querySelector(".manage-panel .sync-log");
        root.querySelectorAll("[data-act], [data-remove]").forEach(b => b.onclick = async () => {
          b.disabled = true;
          out.innerHTML = `<p class="muted">Working…</p>`;
          const res = b.dataset.remove ? await api.post("api/remove", { league_id: b.dataset.remove })
            : b.dataset.act === "clear" ? await api.post("api/clear-cookies") : await api.post("api/sync");
          showLog(out, res);
          setTimeout(() => location.reload(), 1200);
        });
        wireForm(root.querySelector(".league-form"));
      }

      let data;
      try {
        data = await Mingus.load("league");
      } catch (e) {
        if (status) {
          main.innerHTML = `<div class="page-head"><div><h1>My League</h1>
            <p class="muted sub-head">Connect an ESPN fantasy league to see your roster, matchups and schedule.</p></div></div>
            <div class="setup-wrap">${leagueForm()}</div>`;
          wireForm(main.querySelector(".league-form"));
        } else {
          main.innerHTML = `<div class="notice"><strong>No ESPN league connected yet.</strong><br>
            To add one from this page, start the site with <code>python scripts/serve.py</code> instead of <code>python -m http.server</code>,
            then come back to My League.</div>`;
        }
        return;
      }
      const leagues = data.leagues || [data];  // older single-league files have no "leagues" list
      const [players, games, teams] = await Promise.all([Mingus.load("players"), Mingus.load("games"), Mingus.load("teams")]);
      const byId = Object.fromEntries(players.map(p => [p.id, p]));
      const nflWeek = meta.next_week ?? meta.last_week;
      const params = new URLSearchParams(location.search);

      // League picked from the URL, then the last one viewed, then the first in the config.
      let savedLeague = null;
      try { savedLeague = localStorage.getItem("mingus-league"); } catch (e) { /* storage blocked */ }
      let league = leagues.find(l => String(l.league.id) === params.get("league")) ||
        leagues.find(l => String(l.league.id) === savedLeague) || leagues[0];
      let sc, projector, dvp, fantasyWeek, teamById, teamId;

      // Everything that depends on the chosen league (it may use different scoring).
      function selectLeague(l, team) {
        league = l;
        try { localStorage.setItem("mingus-league", String(l.league.id)); } catch (e) { /* storage blocked */ }
        sc = { fmt: l.league.scoring.fmt, passTd: l.league.scoring.passTd };
        projector = makeProjector(players, games, sc, meta);
        dvp = defenseVsPos(players, games, sc);
        fantasyWeek = l.league.week || nflWeek;
        teamById = Object.fromEntries(l.teams.map(t => [t.id, t]));
        teamId = (team && teamById[team] ? team : null) || l.my_team || l.teams[0]?.id;
        history.replaceState(null, "", `league.html?league=${l.league.id}&team=${teamId}`);
      }
      selectLeague(league, Number(params.get("team")));

      // Defense difficulty for a player against a given opponent (D/ST: how much that offense scores).
      const offense = {};
      for (const t of Object.keys(teams)) {
        const r = teamResults(games, t);
        offense[t] = r.length ? r.reduce((a, x) => a + x.pf, 0) / r.length : 0;
      }
      const offRank = Object.fromEntries(Object.keys(offense).sort((a, b) => offense[a] - offense[b]).map((t, i) => [t, i + 1]));
      const difficulty = (pos, opp) => (pos === "DST" ? offRank[opp] : dvp[opp]?.[pos]?.rank);

      const isStarter = slot => !["Bench", "IR"].includes(slot);
      const projOf = r => (r.id && byId[r.id] ? projector.get(byId[r.id], nflWeek) : null);
      const projTotal = t => {
        if (!projector.hasSleeper) return null;
        return Math.round(t.roster.filter(r => isStarter(r.slot)).reduce((a, r) => a + (projOf(r) || 0), 0) * 10) / 10;
      };

      function render() {
        const team = teamById[teamId];
        const standings = [...league.teams].sort((a, b) => (b.wins - a.wins) || (b.pf - a.pf));
        const mine = league.schedule.filter(m => m.home?.team === teamId || m.away?.team === teamId).sort((a, b) => a.week - b.week);
        const thisWeek = mine.find(m => m.week === fantasyWeek);
        const side = (m, id) => (m.home?.team === id ? m.home : m.away);
        const other = (m, id) => (m.home?.team === id ? m.away : m.home);
        const oppTeam = thisWeek && other(thisWeek, teamId) ? teamById[other(thisWeek, teamId).team] : null;
        const futureWeeks = [1, 2, 3, 4].map(n => nflWeek + n).filter(w => w <= 18);

        main.innerHTML = `
          <div class="page-head">
            <div>
              <h1>${esc(league.league.label || league.league.name)}</h1>
              <p class="muted sub-head">ESPN league · Week ${fantasyWeek} · League scoring: ${esc(Scoring.label(sc))}</p>
            </div>
            <div class="league-pickers">
            ${status ? `<button class="btn-plain manage-btn" type="button">Manage leagues</button>` : ""}
            ${leagues.length > 1 ? `<label class="week-select">League
              <select class="league-select" aria-label="League">${leagues.map(l => `<option value="${esc(l.league.id)}" ${l === league ? "selected" : ""}>${esc(l.league.label || l.league.name)}</option>`).join("")}</select>
            </label>` : ""}
            <label class="week-select">Team
              <select class="team-select" aria-label="Team">${league.teams.map(t => `<option value="${t.id}" ${t.id === teamId ? "selected" : ""}>${esc(t.name)}${t.id === league.my_team ? " (you)" : ""}</option>`).join("")}</select>
            </label>
            </div>
          </div>

          <div class="manage-slot" hidden></div>
          ${thisWeek ? `
          <section class="card fantasy-matchup">
            <h3>Week ${fantasyWeek} matchup</h3>
            <div class="fm-row">
              <div class="fm-team"><strong>${esc(team.name)}</strong><span class="muted">${team.wins}-${team.losses}${team.ties ? `-${team.ties}` : ""}</span>
                <span class="fm-proj">${projTotal(team) ?? "—"}</span><span class="muted small">projected</span></div>
              <span class="fm-vs">vs</span>
              <div class="fm-team">${oppTeam ? `<strong><a href="league.html?league=${league.league.id}&team=${oppTeam.id}" class="opp-link">${esc(oppTeam.name)}</a></strong>
                <span class="muted">${oppTeam.wins}-${oppTeam.losses}${oppTeam.ties ? `-${oppTeam.ties}` : ""}</span>
                <span class="fm-proj">${projTotal(oppTeam) ?? "—"}</span><span class="muted small">projected</span>` : `<strong>Bye</strong>`}</div>
            </div>
            ${projector.hasSleeper ? `<p class="muted small">Projected = sum of Sleeper projections for each team's starters in ESPN.</p>` : `<p class="muted small">Projected totals appear once the data update pulls Sleeper projections.</p>`}
          </section>` : ""}

          <section class="card" style="margin-top:14px">
            <div class="card-head"><h3>${esc(team.name)} roster</h3><span class="muted small">Next 4 weeks: green = good matchup, red = tough</span></div>
            <div class="table-wrap flat">
              <table class="data-table compact league-table">
                <thead><tr><th class="l">Slot</th><th class="l">Player</th><th class="l">Wk ${nflWeek}</th><th class="hide-sm">Matchup</th>
                  ${projector.hasSleeper ? `<th class="hl">Proj</th>` : ""}<th${projector.hasSleeper ? "" : ` class="hl"`}>FPTS/G</th><th class="hide-sm">Last 3</th>
                  ${futureWeeks.map(w => `<th class="hide-sm">Wk ${w}</th>`).join("")}</tr></thead>
                <tbody>${team.roster.map(r => {
                  const p = r.id ? byId[r.id] : null;
                  const s = p ? summarize(p, sc) : null;
                  const g = r.team ? weekGame(games, r.team, nflWeek) : null;
                  const d = g ? difficulty(r.pos, g.opp) : null;
                  const proj = projOf(r);
                  return `<tr class="${isStarter(r.slot) ? "" : "bench-row"}">
                    <td class="l"><span class="slot">${esc(r.slot)}</span></td>
                    <td class="l"><div class="pcell">${p ? headshot(p, "sm") : ""}<div>
                      ${p ? `<a href="${playerUrl(p)}">${esc(p.name)}</a> ${injuryTag(p.injury)}` : esc(r.name)}
                      <div class="pmeta">${esc(r.team || "FA")} · ${esc(r.pos)}</div></div></div></td>
                    <td class="l opp">${g ? `<a href="${gameUrl(g)}">${esc(oppLabel(g))}</a>` : `<span class="bye">BYE</span>`}</td>
                    <td class="hide-sm">${d ? `<span class="mchip ${matchupClass(d)}">${ordinal(d)}</span>` : `<span class="muted">—</span>`}</td>
                    ${projector.hasSleeper ? `<td class="hl strong">${proj === null ? "—" : fmt(proj)}</td>` : ""}
                    <td class="${projector.hasSleeper ? "" : "hl strong"}">${s ? fmt(s.ppg) : "—"}</td>
                    <td class="hide-sm">${s ? fmt(s.last3) : "—"}</td>
                    ${futureWeeks.map(w => {
                      const fg = r.team ? weekGame(games, r.team, w) : null;
                      if (!fg) return `<td class="hide-sm"><span class="bye">BYE</span></td>`;
                      const fd = difficulty(r.pos, fg.opp);
                      return `<td class="hide-sm"><span class="mchip ${fd ? matchupClass(fd) : ""}" title="${esc(oppLabel(fg))}${fd ? `: ${ordinal(fd)}` : ""}">${fg.isHome ? "" : "@"}${esc(fg.opp)}</span></td>`;
                    }).join("")}
                  </tr>`;
                }).join("")}</tbody>
              </table>
            </div>
          </section>

          <div class="two-col" style="margin-top:14px">
            <section class="card">
              <h3>Standings</h3>
              <div class="table-wrap flat">
                <table class="data-table compact">
                  <thead><tr><th class="l">#</th><th class="l">Team</th><th>W-L</th><th>PF</th><th>PA</th></tr></thead>
                  <tbody>${standings.map((t, i) => `<tr class="${t.id === teamId ? "me-row" : ""}">
                    <td class="l">${i + 1}</td>
                    <td class="l"><a href="league.html?league=${league.league.id}&team=${t.id}">${esc(t.name)}</a>${t.id === league.my_team ? ` <span class="pill ok">You</span>` : ""}</td>
                    <td>${t.wins}-${t.losses}${t.ties ? `-${t.ties}` : ""}</td><td>${fmt(t.pf)}</td><td>${fmt(t.pa)}</td></tr>`).join("")}</tbody>
                </table>
              </div>
            </section>
            <section class="card">
              <h3>${esc(team.name)} schedule</h3>
              <div class="table-wrap flat">
                <table class="data-table compact">
                  <thead><tr><th class="l">Wk</th><th class="l">Opponent</th><th class="l">Result</th></tr></thead>
                  <tbody>${mine.map(m => {
                    const me = side(m, teamId), op = other(m, teamId);
                    const done = m.winner && m.winner !== "UNDECIDED";
                    const won = done && me.pts > (op?.pts ?? 0);
                    return `<tr class="${m.week === fantasyWeek ? "me-row" : ""}">
                      <td class="l">${m.week}</td>
                      <td class="l">${op ? `<a href="league.html?league=${league.league.id}&team=${op.team}">${esc(teamById[op.team]?.name || "?")}</a>` : "Bye"}</td>
                      <td class="l">${done && op ? `<span class="${won ? "win" : "loss"}">${won ? "W" : "L"} ${fmt(me.pts)}-${fmt(op.pts)}</span>` : `<span class="muted">${m.week === fantasyWeek ? "This week" : "Upcoming"}</span>`}</td>
                    </tr>`;
                  }).join("")}</tbody>
                </table>
              </div>
            </section>
          </div>
          <p class="legend">League data from ESPN (synced ${esc(fmtDateTime(meta.built_at))}). Fantasy points use your league's scoring. Matchup ranks: 1st = the defense allows the most to that position (for D/ST: the offense scores the fewest).</p>`;

        main.querySelector(".team-select").onchange = e => {
          teamId = Number(e.target.value);
          history.replaceState(null, "", `league.html?league=${league.league.id}&team=${teamId}`);
          render();
        };
        const mb = main.querySelector(".manage-btn");
        if (mb) mb.onclick = () => {
          const slot = main.querySelector(".manage-slot");
          if (slot.hidden) { slot.innerHTML = manageView(); wireManage(slot); }
          slot.hidden = !slot.hidden;
        };
        const ls = main.querySelector(".league-select");
        if (ls) ls.onchange = e => { selectLeague(leagues.find(l => String(l.league.id) === e.target.value)); render(); };
      }
      render();
    });
  </script>
</body>
</html>
