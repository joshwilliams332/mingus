<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player · Mingus Sports</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232fbf8a%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22Arial%22 font-weight=%22900%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22%2306150f%22%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main><p class="loading">Loading…</p></main>
  <script src="assets/common.js"></script>
  <script>
    // Season tiles and game-log columns per position: [key, label].
    const TILES = {
      QB: [["pass_yds", "Pass yds"], ["pass_td", "Pass TD"], ["int", "INT"], ["rush_yds", "Rush yds"], ["rush_td", "Rush TD"]],
      RB: [["car", "Carries"], ["rush_yds", "Rush yds"], ["rush_td", "Rush TD"], ["rec", "Receptions"], ["rec_yds", "Rec yds"]],
      WR: [["tgt", "Targets"], ["rec", "Receptions"], ["rec_yds", "Rec yds"], ["rec_td", "Rec TD"]],
      K: [["fg_att", "FG att"], ["fg_50", "FG 50+"], ["fg_miss", "FG missed"], ["xp", "XP made"]],
      DST: [["sacks", "Sacks"], ["int", "INT"], ["fr", "Fum rec"], ["td", "TD"]],
    };
    TILES.TE = TILES.WR;
    const LOG = {
      QB: [["cmp", "Cmp"], ["att", "Att"], ["pass_yds", "Pass Yds"], ["pass_td", "TD"], ["int", "INT"], ["rush_yds", "Rush Yds"], ["rush_td", "Rush TD"]],
      RB: [["car", "Car"], ["rush_yds", "Rush Yds"], ["rush_td", "TD"], ["tgt", "Tgt"], ["rec", "Rec"], ["rec_yds", "Rec Yds"], ["rec_td", "Rec TD"]],
      WR: [["tgt", "Tgt"], ["rec", "Rec"], ["rec_yds", "Yds"], ["rec_td", "TD"], ["rush_yds", "Rush Yds"]],
      K: [["fg_0_39", "FG 0-39"], ["fg_40_49", "40-49"], ["fg_50", "50+"], ["fg_miss", "Miss"], ["fg_long", "Long"], ["xp", "XP"]],
      DST: [["pa", "Pts Allowed"], ["sacks", "Sacks"], ["int", "INT"], ["fr", "Fum Rec"], ["td", "TD"], ["safety", "Sfty"]],
    };
    LOG.TE = LOG.WR;

    Mingus.start(async (main, meta) => {
      const [players, games, notes] = await Promise.all([Mingus.load("players"), Mingus.load("games"), Mingus.content("notes", {})]);
      const id = new URLSearchParams(location.search).get("id");
      const p = players.find(x => x.id === id);
      if (!p) {
        main.innerHTML = `<a class="back" href="rankings.html">← Rankings</a><div class="notice">Player not found.</div>`;
        return;
      }
      document.title = `${p.name} · Mingus Sports`;
      const week = meta.next_week ?? meta.last_week;
      const tab = p.pos;
      let sc = Scoring.get();

      function render() {
        const s = summarize(p, sc);
        const projector = makeProjector(players, games, sc, meta);
        const src = projector.hasSleeper ? ProjSource.get() : "mingus";
        const projNow = { avg: projector.get(p, week, "avg"), sleeper: projector.sleeper(p, week), mingus: projector.mingus(p, week) };
        const ranked = rankList(players.filter(x => x.pos === p.pos), sc, meta);
        const posRank = ranked.findIndex(r => r.p.id === p.id) + 1;
        const next = weekGame(games, p.team, week);
        const maxPts = Math.max(1, ...s.pts);
        const isPlayer = p.pos !== "DST";
        const inj = p.injury;
        const facts = [
          ["Team", p.team], ["Number", p.number != null ? `#${p.number}` : null], ["Age", p.age], ["Height", p.height],
          ["Weight", p.weight && `${p.weight} lbs`], ["College", p.college], ["Experience", p.exp != null ? `${p.exp} yrs` : null],
        ].filter(([, v]) => v != null && v !== "");
        const result = e => {
          const g = weekGame(games, e.team, e.week);
          if (!g?.score) return "";
          const [a, b] = g.score;
          return `<span class="${a > b ? "win" : a < b ? "loss" : ""}">${a > b ? "W" : a < b ? "L" : "T"} ${a}-${b}</span>`;
        };

        main.innerHTML = `
          <a class="back" href="rankings.html?pos=${p.pos}">← ${esc(TAB_LABELS[p.pos])}</a>
          <section class="profile-head pos-${esc(p.pos)}">
            ${headshot(p, "lg")}
            <div class="profile-main">
              <h1>${esc(p.name)} ${injuryTag(inj)}</h1>
              <div class="profile-meta">${posBadge(p.pos)} <a class="team-link" href="${teamUrl(p.team)}">${esc(p.team)}</a>${p.number != null ? `<span>#${p.number}</span>` : ""}</div>
              ${inj ? `<p class="profile-note"><strong>${esc(inj.status)}</strong>${inj.injury ? ` · ${esc(inj.injury)}` : ""} — Week ${inj.week} injury report${inj.practice ? ` (${esc(inj.practice.toLowerCase())})` : ""}.</p>` : ""}
              ${notes.players?.[p.id] ? `<p class="profile-note mingus-note">${esc(notes.players[p.id])}</p>` : ""}
              ${next ? `<p class="profile-note">Week ${week}: <a href="${gameUrl(next)}">${esc(oppLabel(next))}</a> · ${esc(fmtKickoff(next))}</p>` : `<p class="profile-note">On bye in Week ${week}.</p>`}
            </div>
            <div class="profile-rank">
              <strong>${p.pos}${posRank || "—"}</strong>
              <span>${["K", "DST"].includes(p.pos) ? "Standard scoring" : esc(Scoring.label(sc))} · by FPTS/G</span>
            </div>
          </section>

          <div class="grid">
            <section class="card wide">
              <div class="card-head"><h3>${meta.season} season so far</h3></div>
              <div class="tiles">
                <div class="tile accent"><strong>${fmt(s.ppg)}</strong><span>FPTS per game</span></div>
                <div class="tile accent"><strong>${fmt(s.last3)}</strong><span>Last 3 games avg</span></div>
                <div class="tile"><strong>${s.g}</strong><span>Games</span></div>
                ${TILES[tab].map(([k, l]) => `<div class="tile"><strong>${fmt(s.tot[k] || 0)}</strong><span>${l}</span></div>`).join("")}
                ${p.pos === "DST" ? `<div class="tile"><strong>${fmt(s.g ? Math.round(s.tot.pa / s.g * 10) / 10 : 0)}</strong><span>Pts allowed/G</span></div>` : ""}
              </div>
            </section>

            <section class="card">
              <div class="card-head"><h3>Week ${week} matchup</h3>${next ? `<a class="small-link" href="${gameUrl(next)}">Game breakdown →</a>` : ""}</div>
              ${next ? `
                <div class="tiles">
                  <div class="tile accent"><strong>${projNow[src] === null ? "—" : fmt(projNow[src])}</strong><span>${esc(PROJ_SOURCES[src])} projection${projector.hasSleeper && src !== "sleeper" && projNow.sleeper !== null ? ` · Sleeper ${fmt(projNow.sleeper)}` : ""}${src !== "mingus" && projNow.mingus !== null ? ` · Mingus ${fmt(projNow.mingus)}` : ""}</span></div>
                  <div class="tile"><strong>${esc(oppLabel(next))}</strong><span>${esc(fmtKickoff(next))}</span></div>
                  <div class="tile"><strong>${spreadTag(next.spread)}</strong><span>Spread</span></div>
                  <div class="tile"><strong>${fmt(next.total)}</strong><span>Over/under</span></div>
                  <div class="tile"><strong>${fmt(next.implied)}</strong><span>Implied team total</span></div>
                </div>` : `<p class="muted">Bye week.</p>`}
            </section>

            ${isPlayer ? `
            <section class="card">
              <h3>Bio</h3>
              <dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
            </section>` : ""}

            <section class="card ${isPlayer ? "" : "wide"}">
              <h3>Fantasy points by week</h3>
              <div class="bars">
                ${p.log.map((e, i) => `<div class="bar" title="Week ${e.week}: ${fmt(s.pts[i])} pts">
                  <span class="v">${fmt(s.pts[i])}</span>
                  <span class="fill" style="height:${Math.max(0, s.pts[i]) / maxPts * 100}%"></span>
                  <span class="w">W${e.week}</span></div>`).join("")}
              </div>
            </section>

            <section class="card wide">
              <div class="card-head"><h3>Game log</h3><div class="log-scoring"></div></div>
              <div class="table-wrap flat">
                <table class="data-table">
                  <thead><tr><th class="l">Wk</th><th class="l">Opp</th><th class="l">Result</th>
                    ${LOG[tab].map(([, l]) => `<th>${l}</th>`).join("")}<th title="${esc(PROJ_SOURCES[src])} projection before the game">Proj</th><th class="hl">FPTS</th></tr></thead>
                  <tbody>
                    ${p.log.map((e, i) => `<tr>
                      <td class="l">${e.week}</td>
                      <td class="l"><a href="${gameUrl(weekGame(games, e.team, e.week) || { id: "" })}">${e.home === false ? "@" : "vs."} ${esc(e.opp)}</a></td>
                      <td class="l">${result(e)}</td>
                      ${LOG[tab].map(([k]) => `<td>${fmt(e[k] || 0)}</td>`).join("")}
                      <td class="muted">${(v => (v === null ? "—" : fmt(v)))(projector.get(p, e.week, src))}</td>
                      <td class="hl strong">${fmt(s.pts[i])}</td></tr>`).join("")}
                  </tbody>
                </table>
              </div>
            </section>
          </div>`;

        // Kicker and defense scoring don't change with the format, so only show the switch for skill players.
        if (!["K", "DST"].includes(p.pos)) main.querySelector(".log-scoring").innerHTML = scoringControls(sc, next => { sc = next; render(); });
      }
      render();
    });
  </script>
</body>
</html>
