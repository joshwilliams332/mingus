<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matchup · Mingus Sports</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232fbf8a%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22Arial%22 font-weight=%22900%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22%2306150f%22%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main><p class="loading">Loading…</p></main>
  <script src="assets/common.js"></script>
  <script>
    Mingus.start(async (main, meta) => {
      const [players, games, teams, notes] = await Promise.all([
        Mingus.load("players"), Mingus.load("games"), Mingus.load("teams"), Mingus.content("notes", {}),
      ]);
      const g = games.find(x => x.id === new URLSearchParams(location.search).get("id"));
      if (!g) {
        main.innerHTML = `<a class="back" href="games.html">← NFL Games</a><div class="notice">Game not found.</div>`;
        return;
      }
      const sides = [g.away, g.home];
      document.title = `${g.away} @ ${g.home} · Week ${g.week} · Mingus Sports`;
      const final = g.home_score !== null;
      const res = lineResults(g);
      let sc = Scoring.get();
      let projector = makeProjector(players, games, sc, meta);
      const forecastP = fetchForecast(g);

      function sideHead(team, isHome) {
        const tr = teamResults(games, team).filter(r => r.week < g.week);
        const tg = teamGame(g, team);
        return `<a class="h2h-team" href="${teamUrl(team)}">
          ${teamMark(team, teams, "xl")}
          <span class="h2h-name">${esc(teamName(team, teams))}</span>
          <span class="muted">${record(tr, "result")}${isHome ? " · Home" : " · Away"}</span>
          ${final ? `<span class="h2h-score ${tg.score[0] > tg.score[1] ? "won" : ""}">${tg.score[0]}</span>` : ""}
        </a>`;
      }

      // One team's last five games before this one, with betting results.
      function lastFive(team) {
        const all = teamResults(games, team).filter(r => r.week < g.week);
        const five = all.slice(-5).reverse();
        const avgVs = all.filter(r => r.vsImplied !== null);
        const vs = avgVs.length ? Math.round(avgVs.reduce((a, r) => a + r.vsImplied, 0) / avgVs.length * 10) / 10 : null;
        return `<section class="card">
          <div class="card-head"><h3>${esc(teamName(team, teams, false))} · last ${five.length}</h3><a class="small-link" href="${teamUrl(team)}">Team page →</a></div>
          <div class="trend-row">
            <div><strong>${all.length ? fmt(Math.round(all.reduce((a, r) => a + r.pf, 0) / all.length * 10) / 10) : "—"}</strong><span>Pts scored/game</span></div>
            <div><strong>${all.length ? fmt(Math.round(all.reduce((a, r) => a + r.pa, 0) / all.length * 10) / 10) : "—"}</strong><span>Pts allowed/game</span></div>
            <div><strong>${record(all, "result")}</strong><span>Record</span></div>
            <div><strong>${record(all, "ats")}</strong><span>Against spread</span></div>
            <div><strong>${record(all, "ou", "O", "U")}</strong><span>Over-under</span></div>
            <div><strong class="${vs > 0 ? "pos-num" : vs < 0 ? "neg-num" : ""}">${vs === null ? "—" : (vs > 0 ? "+" : "") + vs}</strong><span>Pts vs implied</span></div>
          </div>
          <div class="table-wrap flat">
            <table class="data-table compact">
              <thead><tr><th class="l">Wk</th><th class="l">Opp</th><th class="l">Result</th><th>Line</th><th>ATS</th><th>O/U</th><th>vs Imp.</th></tr></thead>
              <tbody>${five.map(r => `<tr class="click-row" data-href="${gameUrl(r)}">
                <td class="l">${r.week}</td>
                <td class="l">${r.isHome ? "vs." : "@"} ${esc(r.opp)}</td>
                <td class="l"><span class="${r.result === "W" ? "win" : r.result === "L" ? "loss" : ""}">${r.result} ${r.pf}-${r.pa}</span></td>
                <td>${fmtSpread(r.spread)}</td>
                <td><span class="pill ${r.ats === "W" ? "ok" : r.ats === "L" ? "bad" : ""}">${r.ats === "W" ? "Cover" : r.ats === "L" ? "Miss" : "Push"}</span></td>
                <td><span class="pill ${r.ou === "O" ? "ok" : r.ou === "U" ? "bad" : ""}">${r.ou === "O" ? "Over" : r.ou === "U" ? "Under" : "Push"} ${fmt(r.total)}</span></td>
                <td class="${r.vsImplied > 0 ? "pos-num" : r.vsImplied < 0 ? "neg-num" : ""}">${r.vsImplied === null ? "—" : (r.vsImplied > 0 ? "+" : "") + r.vsImplied}</td>
              </tr>`).join("") || `<tr><td colspan="7" class="l muted">No games yet.</td></tr>`}</tbody>
            </table>
          </div>
        </section>`;
      }

      // Each team's top fantasy players against the other team's defense. Picked by Sleeper's projection for this
      // game's week when it's in the data, so trades and role changes count; otherwise by fantasy points per game.
      function edges(team, opp, dvp) {
        const pool = players.filter(p => p.team === team && ["QB", "RB", "WR", "TE"].includes(p.pos));
        const roster = projector.hasSleeper
          ? pool.map(p => { const s = summarize(p, sc); s.proj = projector.get(p, g.week); return { p, s }; })
              .filter(r => r.s.proj !== null)
              .sort((a, b) => (b.s.proj - a.s.proj) || (b.s.ppg - a.s.ppg))
          : rankList(pool, sc, meta).filter(r => r.s.g >= minGames(meta));
        const pick = [["QB", 1], ["RB", 2], ["WR", 2], ["TE", 1]].flatMap(([pos, n]) => roster.filter(r => r.p.pos === pos).slice(0, n));
        return `<section class="card">
          <div class="card-head"><h3>${esc(teamName(team, teams, false))} offense vs ${esc(teamName(opp, teams, false))} defense</h3></div>
          <div class="dvp-row">
            ${["QB", "RB", "WR", "TE"].map(pos => {
              const d = dvp[opp]?.[pos];
              return d ? `<div class="dvp ${matchupClass(d.rank)}" title="${esc(opp)} allows ${d.ppg} fantasy pts/game to ${pos}s">
                <span class="dvp-pos">${pos}</span><strong>${ordinal(d.rank)}</strong><span>${d.ppg}/g allowed</span></div>` : "";
            }).join("")}
          </div>
          <div class="edge-list">
            ${pick.map(({ p, s }) => {
              const d = dvp[opp]?.[p.pos];
              return `<a class="edge ${d ? matchupClass(d.rank) : ""}" href="${playerUrl(p)}">
                ${headshot(p, "md")}
                <span class="edge-body">
                  <span class="edge-name">${esc(p.name)} ${injuryTag(p.injury)}</span>
                  <span class="muted">${posBadge(p.pos)} ${(v => (v === null ? "" : `<strong class="edge-proj">Sleeper proj ${fmt(v)}</strong> · `))(projector.get(p, g.week))}${fmt(s.ppg)} FPTS/G · last 3: ${fmt(s.last3)}</span>
                  ${d ? `<span class="edge-tag">${matchupLabel(d.rank)}: ${esc(opp)} allows the ${ordinal(d.rank)}-most to ${p.pos}s</span>` : ""}
                  ${notes.players?.[p.id] ? `<span class="edge-note">${esc(notes.players[p.id])}</span>` : ""}
                </span>
              </a>`;
            }).join("") || `<p class="muted">Not enough games yet.</p>`}
          </div>
        </section>`;
      }

      // ---------- After the game ----------
      const SKILL_POS = ["QB", "RB", "WR", "TE"];
      // Everyone who played for a team in this game, with their stat line from it.
      function gamePlayers(team) {
        return players.flatMap(p => {
          const e = p.log.find(x => x.week === g.week && x.team === team);
          return e ? [{ p, e }] : [];
        });
      }
      const hasBox = final && gamePlayers(g.away).length > 0 && gamePlayers(g.home).length > 0;
      // A player's season as it stood going into this game.
      const preGame = p => summarize({ ...p, log: p.log.filter(e => e.week < g.week) }, sc);
      const v = (e, k) => e[k] || 0;

      function statLine(e, pos) {
        if (pos === "K") {
          const made = v(e, "fg_0_39") + v(e, "fg_40_49") + v(e, "fg_50");
          return `${made}/${v(e, "fg_att")} FG${e.fg_long ? ` (long ${e.fg_long})` : ""} · ${v(e, "xp")}/${v(e, "xp_att")} XP`;
        }
        const parts = [];
        if (e.att) parts.push(`${v(e, "cmp")}/${e.att}, ${v(e, "pass_yds")} yds${e.pass_td ? `, ${e.pass_td} TD` : ""}${e.int ? `, ${e.int} INT` : ""}`);
        if (e.car) parts.push(`${e.car} car, ${v(e, "rush_yds")} yds${e.rush_td ? `, ${e.rush_td} TD` : ""}`);
        if (e.tgt || e.rec) parts.push(`${v(e, "rec")} rec (${v(e, "tgt")} tgt), ${v(e, "rec_yds")} yds${e.rec_td ? `, ${e.rec_td} TD` : ""}`);
        if (e.fl) parts.push(`${e.fl} fumble${e.fl > 1 ? "s" : ""} lost`);
        return parts.join(" · ") || "No touches";
      }

      // How each team's top fantasy players actually did. "Expected" is Sleeper's projection for this week when
      // it's in the data, otherwise the player's fantasy points per game going into this game.
      function results(team, opp, dvpPre) {
        const rows = gamePlayers(team).filter(r => SKILL_POS.includes(r.p.pos)).map(({ p, e }) => {
          const pre = preGame(p), proj = projector.get(p, g.week);
          return { p, e, proj, exp: proj ?? (pre.g ? pre.ppg : null), act: scoreGame(e, p.pos, sc) };
        }).sort((a, b) => ((b.exp ?? -1) - (a.exp ?? -1)) || (b.act - a.act));
        const pick = [["QB", 1], ["RB", 2], ["WR", 2], ["TE", 1]].flatMap(([pos, n]) => rows.filter(r => r.p.pos === pos).slice(0, n));
        // Anyone outside the top plays who outscored at least one of them.
        const low = Math.min(...pick.map(r => r.act));
        const surprise = rows.filter(r => !pick.includes(r) && r.act >= 10 && r.act > low).sort((a, b) => b.act - a.act)[0];
        const row = (r, isSurprise) => {
          const diff = r.exp === null ? null : Math.round((r.act - r.exp) * 10) / 10;
          const cls = diff === null ? "" : diff >= 5 ? "great" : diff >= 0 ? "good" : diff > -5 ? "meh" : "tough";
          const d = dvpPre[opp]?.[r.p.pos];
          return `<a class="edge result ${cls}" href="${playerUrl(r.p)}">
            ${headshot(r.p, "md")}
            <span class="edge-body">
              <span class="edge-name">${esc(r.p.name)} ${posBadge(r.p.pos)}${isSurprise ? ` <span class="pill ok">Surprise</span>` : ""}</span>
              <span class="stat-line">${statLine(r.e, r.p.pos)}</span>
              <span class="muted small-line">${r.exp === null ? "First game" : `${r.proj !== null ? "Proj" : "Avg"} ${fmt(r.exp)}`}${d ? ` · ${esc(opp)} D ${ordinal(d.rank)} vs ${r.p.pos}` : ""}</span>
            </span>
            <span class="res-pts"><strong>${fmt(r.act)}</strong>${diff === null ? "" : `<span class="${diff >= 0 ? "pos-num" : "neg-num"}">${diff > 0 ? "+" : ""}${fmt(diff)}</span>`}</span>
          </a>`;
        };
        return `<section class="card">
          <div class="card-head"><h3>${esc(teamName(team, teams, false))} vs ${esc(teamName(opp, teams, false))} defense</h3></div>
          <div class="edge-list">${pick.map(r => row(r, false)).join("")}${surprise ? row(surprise, true) : ""}</div>
        </section>`;
      }

      // Team totals summed from the player stat lines.
      function teamTotals(team) {
        const t = { pass: 0, rush: 0, ptd: 0, rtd: 0, to: 0, sk: 0, fd: 0, fg: 0, fga: 0 };
        for (const { p, e } of gamePlayers(team)) {
          if (p.pos === "K") { t.fg += v(e, "fg_0_39") + v(e, "fg_40_49") + v(e, "fg_50"); t.fga += v(e, "fg_att"); continue; }
          if (!SKILL_POS.includes(p.pos)) continue;
          t.pass += v(e, "pass_yds"); t.rush += v(e, "rush_yds"); t.ptd += v(e, "pass_td"); t.rtd += v(e, "rush_td");
          t.to += v(e, "int") + v(e, "fl"); t.sk += v(e, "sk"); t.fd += v(e, "pass_fd") + v(e, "rush_fd");
        }
        return t;
      }

      function teamCompare() {
        const a = teamTotals(g.away), h = teamTotals(g.home);
        // [label, away, home, higher is better?]
        const rows = [
          ["Total yards", a.pass + a.rush, h.pass + h.rush, true],
          ["Passing yards", a.pass, h.pass, true],
          ["Rushing yards", a.rush, h.rush, true],
          ["First downs", a.fd, h.fd, true],
          ["Passing TDs", a.ptd, h.ptd, true],
          ["Rushing TDs", a.rtd, h.rtd, true],
          ["Turnovers", a.to, h.to, false],
          ["Sacks taken", a.sk, h.sk, false],
          ["Field goals", `${a.fg}/${a.fga}`, `${h.fg}/${h.fga}`, null],
        ];
        const better = (x, y, hi) => hi === null || x === y ? "" : (hi ? x > y : x < y) ? "better" : "";
        return `<table class="data-table compact team-compare">
          <thead><tr><th class="l"><span class="opp-cell">${teamMark(g.away, teams, "sm")} ${esc(g.away)}</span></th><th class="c">Team stats</th><th><span class="opp-cell">${esc(g.home)} ${teamMark(g.home, teams, "sm")}</span></th></tr></thead>
          <tbody>${rows.map(([label, x, y, hi]) => `<tr>
            <td class="l ${better(x, y, hi)}">${typeof x === "number" ? fmt(x) : x}</td><td class="c muted">${label}</td><td class="${better(y, x, hi)}">${typeof y === "number" ? fmt(y) : y}</td>
          </tr>`).join("")}</tbody>
        </table>`;
      }

      // One team's player box score: passing, rushing, receiving, kicking and fantasy points.
      function boxScore(team) {
        const list = gamePlayers(team);
        const name = p => `<a href="${playerUrl(p)}">${esc(p.short || p.name)}</a>`;
        const table = (title, heads, rows) => rows.length ? `<h4 class="box-title">${title}</h4>
          <div class="table-wrap flat"><table class="data-table compact box-table">
            <thead><tr><th class="l">Player</th>${heads.map(h => `<th>${h}</th>`).join("")}</tr></thead>
            <tbody>${rows.map(([p, cells]) => `<tr><td class="l">${name(p)}</td>${cells.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
          </table></div>` : "";
        const by = (k, f) => list.filter(f).sort((x, y) => v(y.e, k) - v(x.e, k));
        return [
          table("Passing", ["C/Att", "Yds", "TD", "Int", "Sk"],
            by("pass_yds", r => r.e.att).map(({ p, e }) => [p, [`${v(e, "cmp")}/${e.att}`, v(e, "pass_yds"), v(e, "pass_td"), v(e, "int"), v(e, "sk")]])),
          table("Rushing", ["Car", "Yds", "Avg", "TD"],
            by("rush_yds", r => r.e.car).map(({ p, e }) => [p, [e.car, v(e, "rush_yds"), fmt(Math.round(v(e, "rush_yds") / e.car * 10) / 10), v(e, "rush_td")]])),
          table("Receiving", ["Rec", "Tgt", "Yds", "TD"],
            by("rec_yds", r => r.e.tgt || r.e.rec).map(({ p, e }) => [p, [v(e, "rec"), v(e, "tgt"), v(e, "rec_yds"), v(e, "rec_td")]])),
          table("Kicking", ["FG", "Long", "XP"],
            list.filter(r => r.p.pos === "K").map(({ p, e }) => [p, [`${v(e, "fg_0_39") + v(e, "fg_40_49") + v(e, "fg_50")}/${v(e, "fg_att")}`, e.fg_long || "—", `${v(e, "xp")}/${v(e, "xp_att")}`]])),
          table(`Fantasy points <span class="muted">(${esc(Scoring.label(sc))})</span>`, ["Pos", "FPTS"],
            list.map(r => ({ ...r, pts: scoreGame(r.e, r.p.pos, sc) })).filter(r => r.pts !== 0).sort((x, y) => y.pts - x.pts)
              .map(({ p, pts }) => [p, [posBadge(p.pos), `<strong>${fmt(pts)}</strong>`]])),
        ].join("");
      }
      let boxTeam = g.away;

      function postGame() {
        const dvpPre = defenseVsPos(players, games, sc, g.week);
        return `
          <div class="wide">
            <div class="section-head"><h2>Matchup results</h2><div class="edge-scoring"></div></div>
            <p class="muted small">How each team's top fantasy players did. On the right: fantasy points, and how far above or below expectations they finished.
              ${projector.hasSleeper ? `"Proj" is Sleeper's projection; "Avg" is` : `"Avg" is`} the player's fantasy points per game going into this game. Defense ranks are as of kickoff (1st = allowed the most to that position).</p>
            <div class="two-col">${results(g.away, g.home, dvpPre)}${results(g.home, g.away, dvpPre)}</div>
          </div>
          <section class="card wide">
            <div class="card-head"><h3>Box score</h3></div>
            <div class="box-grid">
              <div>${teamCompare()}</div>
              <div>
                <div class="tabs-bar box-tabs" role="tablist" aria-label="Team">
                  ${sides.map(t => `<button class="pos-tab" role="tab" data-team="${t}" aria-selected="${t === boxTeam}"><span class="opp-cell">${teamMark(t, teams, "sm")} ${esc(teamName(t, teams, false))}</span></button>`).join("")}
                </div>
                <div class="box-body">${boxScore(boxTeam)}</div>
              </div>
            </div>
            <p class="muted small">Offensive skill players and kickers only, from nflverse.</p>
          </section>`;
      }

      function render() {
        const dvp = defenseVsPos(players, games, sc);
        const away = teamGame(g, g.away), home = teamGame(g, g.home);
        const note = notes.games?.[g.id];
        main.innerHTML = `
          ${backLink(`games.html?week=${g.week}`)}
          <section class="h2h">
            ${sideHead(g.away, false)}
            <div class="h2h-mid">
              <span class="h2h-week">Week ${g.week}${g.div ? " · Division game" : ""}</span>
              <strong>${final ? "Final" : "@"}</strong>
              <span class="muted">${esc(fmtKickoff(g))}</span>
            </div>
            ${sideHead(g.home, true)}
          </section>

          <div class="grid">
            <section class="card wide">
              <h3>${final ? "Closing lines and results" : "Lines"}</h3>
              <div class="tiles">
                <div class="tile"><strong>${spreadTag(away.spread)} / ${spreadTag(home.spread)}</strong><span>Spread (${esc(g.away)} / ${esc(g.home)})</span></div>
                <div class="tile"><strong>${fmt(g.total)}</strong><span>Over/under</span></div>
                <div class="tile"><strong>${fmt(away.implied)} – ${fmt(home.implied)}</strong><span>Implied points</span></div>
                <div class="tile"><strong>${fmtSpread(g.away_ml)} / ${fmtSpread(g.home_ml)}</strong><span>Moneyline</span></div>
                ${final && res ? `
                  <div class="tile accent"><strong>${res.cover ? esc(res.cover) : "Push"}</strong><span>Covered the spread</span></div>
                  <div class="tile accent"><strong>${res.ou} (${res.sum})</strong><span>Total</span></div>` : ""}
              </div>
            </section>

            ${note ? `<section class="card wide note-card"><h3>Mingus notes</h3><p>${esc(note)}</p></section>` : ""}

            ${hasBox ? postGame() : ""}

            <section class="card wide">
              <h3>Venue</h3>
              <div class="tiles">
                <div class="tile"><strong>${esc(g.stadium || "—")}</strong><span>Stadium</span></div>
                <div class="tile"><strong>${esc(roofLabel(g.roof))}</strong><span>Roof</span></div>
                <div class="tile"><strong>${esc((g.surface || "—").replace(/^\w/, c => c.toUpperCase()))}</strong><span>Surface</span></div>
                <div class="tile weather"><strong>${["dome", "closed"].includes(g.roof) ? "Indoors" : g.temp !== null ? `${g.temp}°F` : "…"}</strong><span>Weather</span></div>
              </div>
            </section>

            <div class="wide two-col">${lastFive(g.away)}${lastFive(g.home)}</div>

            ${hasBox ? "" : `<div class="wide">
              ${final ? `<div class="notice soft">Final score is in. Matchup results and the box score show up here once nflverse publishes this game's stats, usually within a few hours.</div>` : ""}
              <div class="section-head"><h2>Matchup edges</h2><div class="edge-scoring"></div></div>
              <p class="muted small">Defense ranks: 1st = allows the most fantasy points to that position (best matchup), 32nd = allows the fewest. Season to date.
                ${projector.hasSleeper ? `Players are picked by Sleeper's Week ${g.week} projection.` : "Players are picked by fantasy points per game."}</p>
              <div class="two-col">${edges(g.away, g.home, dvp)}${edges(g.home, g.away, dvp)}</div>
            </div>`}
          </div>`;

        main.querySelectorAll(".box-tabs [data-team]").forEach(b => b.onclick = () => {
          boxTeam = b.dataset.team;
          main.querySelectorAll(".box-tabs [data-team]").forEach(x => x.setAttribute("aria-selected", x === b));
          main.querySelector(".box-body").innerHTML = boxScore(boxTeam);
        });
        main.querySelector(".edge-scoring").innerHTML = scoringControls(sc, next => { sc = next; projector = makeProjector(players, games, sc, meta); render(); });
        main.querySelectorAll(".click-row").forEach(tr => tr.onclick = () => { location.href = tr.dataset.href; });
        forecastP.then(f => {
          const w = main.querySelector(".weather");
          if (!w || ["dome", "closed"].includes(g.roof) || g.temp !== null) return;
          w.innerHTML = f
            ? `<strong>${f.temp}°F · ${f.wind} mph wind</strong><span>Forecast at kickoff${f.rain != null ? ` · ${f.rain}% chance of rain` : ""}</span>`
            : `<strong>—</strong><span>${final ? "Not recorded" : "Forecast shows up within ~2 weeks of kickoff"}</span>`;
        });
      }
      render();
    });
  </script>
</body>
</html>
