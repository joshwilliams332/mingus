<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rankings · Mingus Sports</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232fbf8a%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22Arial%22 font-weight=%22900%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22%2306150f%22%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main><p class="loading">Loading…</p></main>
  <script src="assets/common.js"></script>
  <script>
    // Fantasy-only columns; full stat lines live in the Player Database.
    // [key, header, value(row), display(row)?]
    const COLS = [
      ["proj", "Proj", r => r.s.proj, r => (r.s.proj === null ? "—" : fmt(r.s.proj))],
      ["ppg", "FPTS/G", r => r.s.ppg],
      ["fpts", "FPTS", r => r.s.fpts],
      ["last3", "Last 3", r => r.s.last3],
      ["g", "G", r => r.s.g],
    ];

    Mingus.start(async (main, meta) => {
      const [players, games, teams] = await Promise.all([Mingus.load("players"), Mingus.load("games"), Mingus.load("teams")]);
      const params = new URLSearchParams(location.search);
      const week = meta.next_week ?? meta.last_week;
      const state = { tab: RANK_TABS.includes(params.get("pos")) ? params.get("pos") : "QB", q: "", sort: null, dir: -1, sc: Scoring.get() };
      let projector = makeProjector(players, games, state.sc, meta);
      let dvp = defenseVsPos(players, games, state.sc);
      // For D/ST matchups: opponents ranked by points scored per game (1st = scores the fewest = best for a defense).
      const offense = {};
      for (const t of Object.keys(teams)) {
        const r = teamResults(games, t);
        offense[t] = { ppg: r.length ? Math.round(r.reduce((a, x) => a + x.pf, 0) / r.length * 10) / 10 : 0 };
      }
      Object.keys(offense).sort((a, b) => offense[a].ppg - offense[b].ppg).forEach((t, i) => { offense[t].rank = i + 1; });

      main.innerHTML = `
        <div class="page-head">
          <div>
            <h1>Week ${week} Fantasy Rankings</h1>
            <p class="muted sub-head"></p>
          </div>
          <div class="scoring-slot"></div>
        </div>
        <div class="tabs-bar" role="tablist" aria-label="Position">
          ${RANK_TABS.map(t => `<button class="pos-tab" role="tab" data-tab="${t}">${t}</button>`).join("")}
        </div>
        <div class="controls"><input class="search" type="search" placeholder="Search players, teams or cities (e.g. Atlanta)" aria-label="Search"></div>
        <p class="legend top-legend"></p>
        <div class="table-wrap"><table class="data-table rank-table"><thead></thead><tbody></tbody></table></div>
        <p class="legend bottom-legend"></p>`;

      const thead = main.querySelector("thead"), tbody = main.querySelector("tbody");

      function matchupCell(r) {
        if (!r.game) return `<span class="muted">—</span>`;
        if (r.p.pos === "DST") {
          const o = offense[r.game.opp];
          return `<span class="mchip ${matchupClass(o.rank)}" title="${esc(r.game.opp)} scores ${o.ppg} pts/game, the ${ordinal(33 - o.rank)}-most">${ordinal(o.rank)}</span>`;
        }
        return matchupChip(dvp[r.game.opp]?.[r.p.pos], r.game.opp, r.p.pos);
      }

      function draw() {
        const { tab } = state;
        main.querySelectorAll(".pos-tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
        main.querySelector(".sub-head").textContent = `${TAB_LABELS[tab]} · ${Scoring.label(state.sc)}`;
        const pool = players.filter(p => tab === "FLX" ? FLEX.includes(p.pos) : p.pos === tab);
        // Ranked by Sleeper's projection for this week (players on bye go last), or by points per game without it.
        const ranked = (projector.hasSleeper
          ? pool.map(p => { const s = summarize(p, state.sc); s.proj = projector.get(p, week); return { p, s }; })
              .sort((a, b) => ((b.s.proj ?? -99) - (a.s.proj ?? -99)) || (b.s.ppg - a.s.ppg))
          : rankList(pool, state.sc, meta))
          .map((r, i) => ({ ...r, rank: i + 1, game: weekGame(games, r.p.team, week) }));
        const cols = projector.hasSleeper ? COLS : COLS.filter(c => c[0] !== "proj");

        const q = state.q.toLowerCase();
        let rows = ranked.filter(({ p }) => !q || p.name.toLowerCase().includes(q) || teamMatches(p.team, q, teams));
        if (state.sort) {
          const get = cols.find(c => c[0] === state.sort)[2];
          rows = [...rows].sort((a, b) => ((get(a) ?? -99) - (get(b) ?? -99)) * state.dir);
        }

        const head = (key, label, cls = "") => {
          const on = state.sort === key;
          return `<th class="${cls}" ${on ? `aria-sort="${state.dir < 0 ? "descending" : "ascending"}"` : ""}>
            <button data-sort="${key}">${label}${on ? (state.dir < 0 ? " ▼" : " ▲") : ""}</button></th>`;
        };
        thead.innerHTML = `<tr>
          <th class="l"><button data-sort="">Rk${state.sort ? "" : " ▲"}</button></th>
          <th class="l">Player</th><th class="l">Opp</th>
          <th class="hide-sm" title="${tab === "DST" ? "Opponent's scoring rank (1st = scores the fewest)" : "Opponent's rank vs this position (1st = allows the most)"}">Matchup</th>
          ${cols.map(([k, label], i) => head(k, label, i === 0 ? "hl" : i < 2 ? "" : "hide-sm")).join("")}
        </tr>`;

        tbody.innerHTML = rows.map(r => `
          <tr class="${!r.game || (projector.hasSleeper ? r.s.proj === null : r.s.g < minGames(meta)) ? "unqualified" : ""}">
            <td class="l rank">${r.rank}</td>
            <td class="l"><div class="pcell">${headshot(r.p, "sm")}
              <div><a href="${playerUrl(r.p)}">${esc(r.p.pos === "DST" ? r.p.name : r.p.short)}</a> ${injuryTag(r.p.injury)}
              <div class="pmeta">${esc(r.p.team)}${r.p.pos === "DST" ? "" : ` · ${esc(r.p.pos)}`}</div></div></div></td>
            <td class="l opp">${r.game ? `<a href="${gameUrl(r.game)}">${esc(oppLabel(r.game))}</a>` : `<span class="bye">BYE</span>`}</td>
            <td class="hide-sm">${matchupCell(r)}</td>
            ${cols.map(([k, , get, show], i) => `<td class="${i === 0 ? "hl strong" : i < 2 ? "" : "hide-sm"}">${show ? show(r) : fmt(get(r) ?? 0)}</td>`).join("")}
          </tr>`).join("") || `<tr><td colspan="10" class="l muted">No players match.</td></tr>`;

        const rankedBy = projector.hasSleeper
          ? `Ranked by Sleeper's Week ${week} projection.`
          : `Ranked by fantasy points per game (Sleeper projections weren't in this data update).`;
        main.querySelector(".top-legend").textContent = `${rankedBy} Matchup = opponent's rank against the position this season (green = favorable, red = tough).`;
        const acc = projector.accuracy();
        main.querySelector(".bottom-legend").textContent =
          (projector.hasSleeper && acc.mae !== null ? `Sleeper's projections have missed by ${acc.mae} pts per player on average this season. ` : "") +
          `FPTS is the season total; Last 3 is the average of the last three games. Full stat lines are in the Player Database.`;

        thead.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
          const key = b.dataset.sort || null;
          state.dir = state.sort === key ? -state.dir : -1;
          state.sort = key;
          draw();
        });
      }

      main.querySelector(".scoring-slot").innerHTML = scoringControls(state.sc, sc => {
        state.sc = sc; projector = makeProjector(players, games, sc, meta); dvp = defenseVsPos(players, games, sc); draw();
      });
      main.querySelectorAll(".pos-tab").forEach(b => b.onclick = () => {
        state.tab = b.dataset.tab; state.sort = null;
        history.replaceState(null, "", `rankings.html?pos=${state.tab}`);
        draw();
      });
      main.querySelector(".search").oninput = e => { state.q = e.target.value.trim(); draw(); };
      draw();
    });
  </script>
</body>
</html>
