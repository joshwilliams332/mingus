<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Database · Mingus FF</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232fbf8a%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22Arial%22 font-weight=%22900%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22%2306150f%22%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main><p class="loading">Loading…</p></main>
  <script src="assets/common.js"></script>
  <script>
    const PAGE = 50;
    const t = (k, label) => [k, label, r => r.s.tot[k] || 0];
    // Stat columns per position filter: [key, header, value(row), display(row)?]
    const STATS = {
      ALL: [["g", "G", r => r.s.g], ["fpts", "FPTS", r => r.s.fpts], ["ppg", "FPTS/G", r => r.s.ppg]],
      QB: [["g", "G", r => r.s.g], t("cmp", "Cmp"), t("att", "Att"), t("pass_yds", "Pass Yds"), t("pass_td", "Pass TD"), t("int", "INT"),
           t("car", "Car"), t("rush_yds", "Rush Yds"), t("rush_td", "Rush TD")],
      RB: [["g", "G", r => r.s.g], t("car", "Car"), t("rush_yds", "Rush Yds"),
           ["ypc", "YPC", r => (r.s.tot.car ? Math.round(r.s.tot.rush_yds / r.s.tot.car * 10) / 10 : 0)], t("rush_td", "Rush TD"),
           t("tgt", "Tgt"), t("rec", "Rec"), t("rec_yds", "Rec Yds"), t("rec_td", "Rec TD")],
      WR: [["g", "G", r => r.s.g], t("tgt", "Tgt"), t("rec", "Rec"), t("rec_yds", "Rec Yds"),
           ["ypr", "Y/R", r => (r.s.tot.rec ? Math.round(r.s.tot.rec_yds / r.s.tot.rec * 10) / 10 : 0)], t("rec_td", "Rec TD"),
           t("car", "Car"), t("rush_yds", "Rush Yds")],
      K: [["g", "G", r => r.s.g], ["fg", "FG", r => (r.s.tot.fg_0_39 || 0) + (r.s.tot.fg_40_49 || 0) + (r.s.tot.fg_50 || 0),
           r => `${(r.s.tot.fg_0_39 || 0) + (r.s.tot.fg_40_49 || 0) + (r.s.tot.fg_50 || 0)}/${r.s.tot.fg_att || 0}`],
          t("fg_40_49", "40-49"), t("fg_50", "50+"), ["long", "Long", r => r.s.fg_long], ["xp", "XP", r => r.s.tot.xp || 0, r => `${r.s.tot.xp || 0}/${r.s.tot.xp_att || 0}`]],
      DST: [["g", "G", r => r.s.g], t("sacks", "Sacks"), t("int", "INT"), t("fr", "Fum Rec"), t("td", "TD"), t("safety", "Sfty"),
            ["pag", "PA/G", r => (r.s.g ? Math.round(r.s.tot.pa / r.s.g * 10) / 10 : 0)]],
    };
    STATS.TE = STATS.WR;
    const FANTASY = [["fpts", "FPTS", r => r.s.fpts], ["ppg", "FPTS/G", r => r.s.ppg]];

    Mingus.start(async (main, meta) => {
      const [players, teams] = await Promise.all([Mingus.load("players"), Mingus.load("teams")]);
      const params = new URLSearchParams(location.search);
      // ?sort=car&dir=asc opens the table already sorted; ?hl=<player id> highlights that player (links from player pages).
      const state = {
        pos: STATS[params.get("pos")] ? params.get("pos") : "ALL", team: params.get("team") || "", q: "",
        sort: params.get("sort") || "ppg", dir: params.get("dir") === "asc" ? 1 : -1, shown: PAGE, sc: Scoring.get(),
        hl: params.get("hl"), scrolled: false,
      };
      const abbrs = Object.keys(teams).sort((a, b) => teamName(a, teams).localeCompare(teamName(b, teams)));

      main.innerHTML = `
        <div class="page-head">
          <div><h1>Player Database</h1><p class="muted sub-head">${meta.season} season stats for every QB, RB, WR, TE, kicker and defense</p></div>
          <div class="db-scoring"></div>
        </div>
        <div class="tabs-bar" role="tablist" aria-label="Position">
          ${["ALL", "QB", "RB", "WR", "TE", "K", "DST"].map(p => `<button class="pos-tab" role="tab" data-pos="${p}">${p === "ALL" ? "All" : p}</button>`).join("")}
        </div>
        <div class="controls">
          <select class="filter" aria-label="Team">
            <option value="">All teams</option>
            ${abbrs.map(a => `<option value="${a}">${esc(teamName(a, teams))}</option>`).join("")}
          </select>
          <input class="search" type="search" placeholder="Search players or teams" aria-label="Search">
        </div>
        <div class="table-wrap"><table class="data-table compact db-table"><thead></thead><tbody></tbody></table></div>
        <button class="btn-plain more" hidden>Show more</button>`;

      const thead = main.querySelector("thead"), tbody = main.querySelector("tbody"), more = main.querySelector(".more");
      main.querySelector(".filter").value = state.team;

      function draw() {
        main.querySelectorAll(".pos-tab").forEach(b => b.setAttribute("aria-selected", b.dataset.pos === state.pos));
        const cols = state.pos === "ALL" ? STATS.ALL : [...STATS[state.pos], ...FANTASY];
        if (!cols.some(c => c[0] === state.sort)) { state.sort = "ppg"; state.dir = -1; }
        const get = cols.find(c => c[0] === state.sort)[2];
        const q = state.q.toLowerCase();
        const rows = players
          .filter(p => (state.pos === "ALL" || p.pos === state.pos) && (!state.team || p.team === state.team))
          .filter(p => !q || p.name.toLowerCase().includes(q) || teamMatches(p.team, q, teams))
          .map(p => ({ p, s: summarize(p, state.sc) }))
          .sort((a, b) => ((get(a) ?? -1) - (get(b) ?? -1)) * state.dir);
        // Make sure the highlighted player is on the page, even if he's past the first 50.
        const hlAt = state.hl ? rows.findIndex(r => r.p.id === state.hl) : -1;
        if (hlAt >= state.shown) state.shown = Math.ceil((hlAt + 1) / PAGE) * PAGE;

        thead.innerHTML = `<tr><th class="l">Player</th>${state.pos === "ALL" ? `<th class="l">Pos</th>` : ""}<th class="l">Team</th>
          ${cols.map(([k, label]) => `<th class="${k === "ppg" ? "hl" : ""} ${k === state.sort ? "sorted" : ""}"><button data-sort="${k}">${label}${state.sort === k ? (state.dir < 0 ? " ▼" : " ▲") : ""}</button></th>`).join("")}</tr>`;
        tbody.innerHTML = rows.slice(0, state.shown).map((r, i) => `<tr class="${r.p.id === state.hl ? "hl-row" : ""}">
          <td class="l"><div class="pcell">${headshot(r.p, "sm")}<div>
            <a href="${playerUrl(r.p)}">${esc(r.p.name)}</a> ${injuryTag(r.p.injury)}
            ${r.p.pos === "DST" ? "" : `<div class="pmeta">${[r.p.age && `Age ${r.p.age}`, r.p.college].filter(Boolean).map(esc).join(" · ")}</div>`}
          </div></div></td>
          ${state.pos === "ALL" ? `<td class="l">${posBadge(r.p.pos)}</td>` : ""}
          <td class="l"><a class="team-link" href="${teamUrl(r.p.team)}">${esc(r.p.team)}</a></td>
          ${cols.map(([k, , g, show]) => `<td class="${k === "ppg" ? "hl strong" : ""} ${k === state.sort ? "sorted" : ""}">${show ? show(r) : fmt(g(r) ?? 0)}</td>`).join("")}
        </tr>`).join("") || `<tr><td colspan="14" class="l muted">No players match.</td></tr>`;
        more.hidden = rows.length <= state.shown;
        if (hlAt >= 0 && !state.scrolled) {
          state.scrolled = true;
          tbody.querySelector(".hl-row")?.scrollIntoView({ block: "center" });
          // On narrow screens the table scrolls sideways; bring the sorted column into view next to the names.
          const wrap = main.querySelector(".table-wrap"), th = thead.querySelector("th.sorted"), first = thead.querySelector("th");
          if (th && wrap.scrollWidth > wrap.clientWidth) wrap.scrollLeft = Math.max(0, th.offsetLeft - first.offsetWidth - 8);
        }
        history.replaceState(null, "", `players.html?${new URLSearchParams({
          ...(state.pos !== "ALL" && { pos: state.pos }), ...(state.sort !== "ppg" && { sort: state.sort }),
          ...(state.dir > 0 && { dir: "asc" }), ...(state.hl && { hl: state.hl }) })}`.replace(/\?$/, ""));
        thead.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
          state.dir = state.sort === b.dataset.sort ? -state.dir : -1;
          state.sort = b.dataset.sort; draw();
        });
      }
      main.querySelectorAll(".pos-tab").forEach(b => b.onclick = () => {
        state.pos = b.dataset.pos; state.shown = PAGE;
        draw();
      });
      main.querySelector(".filter").onchange = e => { state.team = e.target.value; state.shown = PAGE; draw(); };
      main.querySelector(".search").oninput = e => { state.q = e.target.value.trim(); state.shown = PAGE; draw(); };
      more.onclick = () => { state.shown += PAGE; draw(); };
      main.querySelector(".db-scoring").innerHTML = scoringControls(state.sc, sc => { state.sc = sc; draw(); });
      draw();
    });
  </script>
</body>
</html>
