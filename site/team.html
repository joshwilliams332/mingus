<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team · Mingus Sports</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232fbf8a%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22Arial%22 font-weight=%22900%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22%2306150f%22%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main><p class="loading">Loading…</p></main>
  <script src="assets/common.js"></script>
  <script>
    Mingus.start(async (main, meta) => {
      const [players, games, teams, notes, teamstats] = await Promise.all([
        Mingus.load("players"), Mingus.load("games"), Mingus.load("teams"), Mingus.content("notes", {}),
        Mingus.load("teamstats").catch(() => ({})),
      ]);
      const team = (new URLSearchParams(location.search).get("team") || "").toUpperCase();
      if (!teams[team]) {
        main.innerHTML = `<a class="back" href="players.html">← Player Database</a><div class="notice">Team not found.</div>`;
        return;
      }
      document.title = `${teamName(team, teams)} · Mingus Sports`;
      let sc = Scoring.get();
      const results = teamResults(games, team);
      const schedule = games.filter(g => g.type === "REG" && (g.home === team || g.away === team)).sort((a, b) => a.week - b.week);
      const weeks = new Set(schedule.map(g => g.week));
      const byeWeek = [...Array(18).keys()].map(i => i + 1).find(w => !weeks.has(w));
      const next = schedule.find(g => g.home_score === null);
      const avg = teamAverages(games);
      const pf = results.reduce((a, r) => a + r.pf, 0), pa = results.reduce((a, r) => a + r.pa, 0);

      const POSITIONS = ["QB", "RB", "WR", "TE"];
      const tabState = { def: "WR" };

      // Team offense per game, ranked across the league (1st = most). bad: more is worse (turnovers, sacks);
      // neutral: style, not quality (pass rate, attempts, carries), so no color.
      const OFF_STATS = [
        ["ppg", "Points", "/g"], ["epa", "EPA per play", "", { help: "Expected points added per play: the standard efficiency stat. Above 0 is good." }],
        ["yds", "Total yards", "/g"], ["ypp", "Yards per play"], ["plays", "Plays", "/g"],
        ["pass_rate", "Pass rate", "", { neutral: true, pct: true }], ["att", "Pass attempts", "/g", { neutral: true }], ["car", "Carries", "/g", { neutral: true }],
        ["pass_yds", "Pass yards", "/g"], ["ypa", "Yards per attempt"], ["rush_yds", "Rush yards", "/g"], ["ypc", "Yards per carry"],
        ["fd", "First downs", "/g"], ["to", "Turnovers", "/g", { bad: true }], ["sk", "Sacks taken", "/g", { bad: true }],
      ];
      const offense = (() => {
        const avgPts = teamAverages(games), out = {};
        for (const [t, log] of Object.entries(teamstats)) {
          if (!log.length) continue;
          const sum = k => log.reduce((a, e) => a + (e[k] || 0), 0), g = log.length;
          const plays = sum("att") + sum("sk") + sum("car"), yds = sum("pass_yds") + sum("rush_yds");
          out[t] = {
            g, ppg: avgPts[t]?.pf ?? null, plays: plays / g, pass_rate: plays ? (sum("att") + sum("sk")) / plays : null,
            att: sum("att") / g, car: sum("car") / g, yds: yds / g, ypp: plays ? yds / plays : null,
            pass_yds: sum("pass_yds") / g, rush_yds: sum("rush_yds") / g, ypa: sum("att") ? sum("pass_yds") / sum("att") : null,
            ypc: sum("car") ? sum("rush_yds") / sum("car") : null, epa: plays ? (sum("pass_epa") + sum("rush_epa")) / plays : null,
            fd: sum("fd") / g, to: (sum("int") + sum("fl")) / g, sk: sum("sk") / g,
          };
        }
        for (const [k] of OFF_STATS) {
          const vals = Object.values(out).map(o => o[k]).filter(v => v !== null);
          for (const o of Object.values(out)) if (o[k] !== null) o[k + "_rank"] = vals.filter(v => v > o[k]).length + 1;
        }
        return out;
      })();
      const nTeams = Object.keys(offense).length;

      function offenseCard() {
        const o = offense[team];
        if (!o) return `<section class="card"><h3>Offense</h3><p class="muted">No games yet.</p></section>`;
        const val = (k, o2) => {
          const v = o[k];
          if (v === null) return "—";
          if (k === "pass_rate") return `${Math.round(v * 100)}% pass · ${Math.round((1 - v) * 100)}% run`;
          return fmt(Math.round(v * (k === "epa" ? 100 : 10)) / (k === "epa" ? 100 : 10));
        };
        return `<section class="card">
          <div class="card-head"><h3>${esc(teamName(team, teams, false))} offense</h3></div>
          <p class="muted small">Per game over ${o.g} games, ranked among all ${nTeams} teams (1st = most). Green = a strength, red = a weakness; style stats (pass rate, attempts, carries) aren't colored.</p>
          <div class="split-rows">${OFF_STATS.map(([k, label, unit = "", opt = {}]) => {
            const r = o[k + "_rank"];
            const cls = opt.neutral ? "neutral" : matchupClass(Math.round((opt.bad ? nTeams + 1 - r : r) / nTeams * 32));
            return `<div class="split-row"><span${opt.help ? ` class="has-help" title="${esc(opt.help)}"` : ""}>${label}</span><strong>${val(k)}<small>${unit}</small></strong>
              ${r ? `<span class="mchip ${cls}" title="${ordinal(r)} of ${nTeams}">${ordinal(r)}</span>` : "<span></span>"}</div>
              ${k === "pass_rate" ? `<p class="split-key">Key: 1st = passes the most, ${ordinal(nTeams)} = runs the most.</p>` : ""}`;
          }).join("")}</div>
          <p class="muted small">EPA per play: expected points added per play, the standard measure of offensive efficiency. Above 0 is good.</p>
        </section>`;
      }

      // Season box score: this team's games only (a traded player's games elsewhere don't count), football order.
      function boxScore() {
        const rows = players.filter(p => p.pos !== "DST").map(p => {
          const log = p.log.filter(e => e.team === team);
          if (!log.length) return null;
          const t = {};
          for (const e of log) for (const [k, v] of Object.entries(e)) if (typeof v === "number" && k !== "week") t[k] = (t[k] || 0) + v;
          const fpts = log.reduce((a, e) => a + scoreGame(e, p.pos, sc), 0);
          return { p, t, g: log.length, fppg: Math.round(fpts / log.length * 10) / 10 };
        }).filter(Boolean);
        const r1 = (a, b) => (b ? fmt(Math.round(a / b * 10) / 10) : "—");
        const name = r => `<td class="l"><a href="${playerUrl(r.p)}">${esc(r.p.short)}</a> ${posBadge(r.p.pos)} ${injuryTag(r.p.injury)}</td>`;
        const table = (title, list, cols) => list.length ? `
          <h4 class="box-head">${title}</h4>
          <div class="table-wrap flat"><table class="data-table compact box-table">
            <thead><tr><th class="l">Player</th><th class="hl">FPTS/G</th>${cols.map(c => `<th>${c[0]}</th>`).join("")}<th>G</th></tr></thead>
            <tbody>${list.map(r => `<tr>${name(r)}<td class="hl strong">${fmt(r.fppg)}</td>${cols.map(c => `<td>${c[1](r.t)}</td>`).join("")}<td>${r.g}</td></tr>`).join("")}</tbody>
          </table></div>` : "";
        const by = k => (a, b) => (b.t[k] || 0) - (a.t[k] || 0);
        return `<section class="card" style="margin-top:14px">
          <div class="card-head"><h3>Season box score</h3><div class="team-scoring"></div></div>
          <p class="muted small">Season totals in ${esc(teamName(team, teams, false))} games. FPTS/G counts all of a player's stats.</p>
          ${table("Passing", rows.filter(r => r.t.att).sort(by("att")), [
            ["Cmp/Att", t => `${t.cmp || 0}/${t.att || 0}`], ["Yds", t => fmt(t.pass_yds || 0)], ["TD", t => t.pass_td || 0],
            ["INT", t => t.int || 0], ["Y/A", t => r1(t.pass_yds || 0, t.att)], ["Rush yds", t => fmt(t.rush_yds || 0)]])}
          ${table("Rushing", rows.filter(r => r.t.car).sort(by("car")).slice(0, 6), [
            ["Car", t => t.car], ["Yds", t => fmt(t.rush_yds || 0)], ["Y/C", t => r1(t.rush_yds || 0, t.car)], ["TD", t => t.rush_td || 0]])}
          ${table("Receiving", rows.filter(r => r.t.tgt).sort(by("tgt")).slice(0, 10), [
            ["Tgt", t => t.tgt], ["Rec", t => t.rec || 0], ["Yds", t => fmt(t.rec_yds || 0)], ["Y/R", t => r1(t.rec_yds || 0, t.rec)], ["TD", t => t.rec_td || 0]])}
          ${table("Kicking", rows.filter(r => r.p.pos === "K"), [
            ["FG", t => `${(t.fg_0_39 || 0) + (t.fg_40_49 || 0) + (t.fg_50 || 0)}/${t.fg_att || 0}`], ["50+", t => t.fg_50 || 0], ["XP", t => `${t.xp || 0}/${t.xp_att || 0}`]])}
        </section>`;
      }

      // One position's stats for one side, as rows: label, per game, rank chip (colored by who it's good for).
      function splitRows(side, pos, splits) {
        const t = splits[side][team]?.[pos];
        if (!t) return `<p class="muted">No games yet.</p>`;
        return `<div class="split-rows">${SPLIT_STATS[pos].map(([k, label, o = {}]) => {
          const c = t[k];
          if (!c || c.v === null) return "";
          return `<div class="split-row"><span>${label}</span><strong>${fmt(c.v)}<small>${o.rate ? "" : "/g"}</small></strong>
            <span class="mchip ${splitMatchup(pos, k, c.rank, c.of)}" title="${ordinal(c.rank)} of ${c.of} teams">${ordinal(c.rank)}</span></div>`;
        }).join("")}</div>`;
      }

      function render() {
        const splits = positionSplits(players, sc);

        // Next game: opponent, kickoff and lines; the full preview lives on the matchup page.
        function preview() {
          if (!next) return "";
          const tg = teamGame(next, team), opp = tg.opp, otg = teamGame(next, opp), wr = weekLineRanks(games, next.week);
          return `<section class="card preview-card" style="margin-top:14px">
            <div class="card-head"><h3>Next game · Week ${next.week}</h3></div>
            <div class="pv-matchup">
              <span class="pv-team">${teamMark(team, teams, "md")}<strong>${esc(teamName(team, teams, false))}</strong></span>
              <span class="pv-at">${tg.isHome ? "vs" : "@"}</span>
              <a class="pv-team" href="${teamUrl(opp)}">${teamMark(opp, teams, "md")}<strong>${esc(teamName(opp, teams, false))}</strong></a>
            </div>
            <p class="muted small pv-when">${esc(fmtKickoff(next))}${next.stadium ? ` · ${esc(next.stadium)}` : ""}</p>
            <div class="tiles pv-lines">
              <div class="tile"><strong>${spreadTag(tg.spread)}</strong><span>${esc(team)} spread</span></div>
              <div class="tile"><strong>${fmt(next.total)}${wr.total(next)}</strong><span>Over/under</span></div>
              <div class="tile"><strong>${fmt(tg.implied)}${wr.implied(tg.implied)}</strong><span>${esc(team)} implied</span></div>
              <div class="tile"><strong>${fmt(otg.implied)}${wr.implied(otg.implied)}</strong><span>${esc(opp)} implied</span></div>
            </div>
            <a class="btn pv-cta" href="${gameUrl(next)}">Full matchup preview →</a>
          </section>`;
        }
        main.innerHTML = `
          ${backLink(`games.html`)}
          <section class="team-head" style="--tc:${teams[team].color}">
            ${teamMark(team, teams, "xl")}
            <div>
              <h1>${esc(teamName(team, teams))}</h1>
              <p class="muted">${record(results, "result")} · ATS ${record(results, "ats")} · O/U ${record(results, "ou", "O", "U")}${byeWeek ? ` · Bye: Week ${byeWeek}` : ""}</p>
            </div>
            <div class="team-stats">
              <div><strong>${results.length ? fmt(Math.round(pf / results.length * 10) / 10) : "—"}${rankOf(avg, team, "pf")}</strong><span>Pts/game</span></div>
              <div><strong>${results.length ? fmt(Math.round(pa / results.length * 10) / 10) : "—"}${rankOf(avg, team, "pa", true)}</strong><span>Allowed/game</span></div>
            </div>
          </section>

          ${notes.teams?.[team] ? `<section class="card note-card" style="margin-top:14px"><h3>Mingus notes</h3><p>${esc(notes.teams[team])}</p></section>` : ""}

          ${preview()}

          <div class="two-col" style="margin-top:14px">
            <section class="card split-card" data-side="def">
              <div class="card-head"><h3>${esc(teamName(team, teams, false))} defense by position</h3><a class="small-link" href="teams.html?side=def&pos=${tabState.def}">All teams →</a></div>
              <p class="muted small">What they give up per game${splits.def[team] ? ` (${splits.def[team].games} games)` : ""}. 1st = gives up the most. Green = an easy matchup for opponents, red = a tough one.</p>
              <div class="tabs split-tabs">${POSITIONS.map(p => `<button class="tab" type="button" data-pos="${p}" aria-pressed="${tabState.def === p}">${p}</button>`).join("")}</div>
              ${splitRows("def", tabState.def, splits)}
            </section>
            ${offenseCard()}
          </div>

          ${boxScore()}

          <section class="card" style="margin-top:14px">
            <h3>Schedule and results</h3>
            <div class="table-wrap flat">
              <table class="data-table team-sched">
                <thead><tr><th class="l">Wk</th><th class="l">Opp</th><th class="l">Result</th><th>Spread</th><th class="hide-sm">O/U</th><th>ATS</th><th class="hide-sm">Total</th><th class="hide-sm">Pts vs implied</th></tr></thead>
                <tbody>${schedule.map(g => {
                  const r = results.find(x => x.id === g.id);
                  const tg = teamGame(g, team);
                  return `<tr class="click-row" data-href="${gameUrl(g)}">
                    <td class="l">${g.week}</td>
                    <td class="l"><span class="opp-cell">${tg.isHome ? "vs." : "@"} ${teamMark(tg.opp, teams, "sm")} <span class="opp-name">${esc(teamName(tg.opp, teams, false))}</span></span></td>
                    <td class="l">${r ? `<span class="${r.result === "W" ? "win" : r.result === "L" ? "loss" : ""}">${r.result} ${r.pf}-${r.pa}</span>` : kickoffCell(g)}</td>
                    <td>${spreadTag(tg.spread)}</td>
                    <td class="hide-sm">${fmt(g.total)}</td>
                    <td>${r ? `<span class="pill ${r.ats === "W" ? "ok" : r.ats === "L" ? "bad" : ""}">${r.ats === "W" ? "Cover" : r.ats === "L" ? "Miss" : "Push"}</span>` : ""}</td>
                    <td class="hide-sm">${r ? `<span class="pill ${r.ou === "O" ? "ok" : r.ou === "U" ? "bad" : ""}">${r.ou === "O" ? "Over" : r.ou === "U" ? "Under" : "Push"}</span>` : ""}</td>
                    <td class="hide-sm ${r?.vsImplied > 0 ? "pos-num" : r?.vsImplied < 0 ? "neg-num" : ""}">${r && r.vsImplied !== null ? (r.vsImplied > 0 ? "+" : "") + r.vsImplied : ""}</td>
                  </tr>`;
                }).join("")}</tbody>
              </table>
            </div>
          </section>

`;
        main.querySelector(".team-scoring").innerHTML = scoringControls(sc, n => { sc = n; render(); });
        main.querySelectorAll(".split-card").forEach(card => card.querySelectorAll(".split-tabs .tab").forEach(b => b.onclick = () => {
          tabState[card.dataset.side] = b.dataset.pos; render();
        }));
        main.querySelectorAll(".click-row").forEach(tr => tr.onclick = () => { location.href = tr.dataset.href; });
      }
      render();
    });
  </script>
</body>
</html>
