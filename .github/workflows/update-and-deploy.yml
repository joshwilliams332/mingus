name: Update data and deploy

on:
  schedule:
    - cron: "17 23 * * *"   # Daily 23:17 UTC (evening in the US), after the day's injury and practice reports
    # Extra runs after each game window so finals and stats land the same night (times in UTC; GitHub
    # often starts scheduled runs late, and nflverse publishes stats a little after the games end).
    - cron: "47 22 * * 0"   # Sun 22:47 UTC: after the 1:00 PM ET games
    - cron: "47 1 * * 1"    # Mon 01:47 UTC (Sun evening ET): after the 4:05/4:25 PM ET games
    - cron: "47 5 * * 1"    # Mon 05:47 UTC (Sun night ET): after Sunday Night Football
    - cron: "47 5 * * 2"    # Tue 05:47 UTC (Mon night ET): after Monday Night Football
    - cron: "47 5 * * 5"    # Fri 05:47 UTC (Thu night ET): after Thursday Night Football
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download nflverse data
        run: python3 scripts/build_data.py
      # Browsers keep style.css and common.js cached for a while, so after a deploy a page could load the new
      # HTML with the old script. Tagging the links with this commit makes every deploy fetch fresh copies.
      - name: Tag asset links with this commit
        run: sed -i -E "s#assets/(common\.js|style\.css)\"#assets/\1?v=${GITHUB_SHA::8}\"#g" site/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
